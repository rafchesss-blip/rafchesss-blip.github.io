          <div class="avatar"><img src="${esc(ICH.profilbild)}" alt="Profilbild von ${esc(ICH.vorname)}"
               onerror="this.parentNode.textContent='😎'"></div>
          <div>
            <h1>Hi, ich bin <span class="gradient">${esc(ICH.vorname)}</span>! 👋</h1>
            <p class="lead">${esc(ICH.intro)}</p>
          </div>
        </div>
      </section>

      <div class="about"><p style="margin:0">${esc(ICH.ueberMich)}</p></div>

      <h2>🔬 Jugend forscht</h2>
      <div class="about jf">
        <div class="jf-stats">
          <div><div class="num gradient">${jf.teilnahmen}×</div><div class="lbl">dabei gewesen</div></div>
          <div><div class="num gradient">${jf.landeswettbewerb}×</div><div class="lbl">im Landeswettbewerb</div></div>
        </div>
        <div>${jf.text.map(t => `<p>${esc(t)}</p>`).join('')}</div>
      </div>

      <h2>🎯 Was ich in meiner Freizeit mache</h2>
      <p class="lead" style="margin-bottom:16px">${esc(ICH.freizeit)}</p>
      <div class="features">
        ${ICH.hobbys.map(([e, t, d]) => `<div class="feature hobby"><div class="he${e === '♟️' ? ' egg" onclick="openPuzzle()' : ''}">${e}</div><b>${esc(t)}</b><span>${esc(d)}</span></div>`).join('')}
      </div>

      <h2>✉️ Schreib mir gerne!</h2>
      <div class="about">
        <p style="margin-top:0">${esc(ICH.kontakt)}</p>
        <a class="btn" style="margin-top:4px" href="mailto:${esc(ICH.email.join('@'))}">✉️ ${esc(ICH.email.join('@'))}</a>
        <a class="btn ghost" style="margin-top:4px" href="${esc(ICH.github)}" target="_blank" rel="noopener">Mein GitHub-Profil</a>
      </div>`;
  },
  impressum() {
    const mail = esc(ICH.email.join('@'));
    return `<div class="legal">
      <h1>Impressum</h1>
      <div class="about">
        ${ICH.impressum.map(t => `<p>${esc(t)}</p>`).join('')}
        <p>Kontakt: <a href="mailto:${mail}">${mail}</a></p>
      </div>
      <a class="btn" href="#home">← Zurück</a>
    </div>`;
  },
  projekte() {
    return `<h1>🚀 Projekte</h1><p class="lead">Alles, was ich bisher gebaut habe.</p><h2></h2>
      <div class="cards">${PROJEKTE.map(projectCard).join('')}<div class="card placeholder">🛠️ Nächstes Projekt<br>kommt bald …</div></div>`;
  },
  projekt(id) {
    const p = PROJEKTE.find(x => x.id === id);
    if (!p) return PAGES.notfound();
    return `
      <h1 class="ptitle">${esc(p.name)} <span class="pemoji">${p.emoji}</span></h1>
      <p class="pshort">${esc(p.kurz)}</p>
      <div class="pdesc">${[].concat(p.beschreibung).map(t => `<p>${esc(t)}</p>`).join('')}</div>
      ${p.timeline && p.timeline.length ? `
      <h2>🗓️ Timeline</h2>
      <ol class="timeline">
        ${p.timeline.map(([d, e, t]) => `
          <li><span class="tl-dot">${e}</span><span class="tl-date">${esc(d)}</span><span class="tl-text">${esc(t)}</span></li>`).join('')}
      </ol>` : ''}
      <div class="pbtns">
        ${p.link ? `<a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener">▶ Austesten</a>` : ''}
        ${p.code ? `<a class="btn ghost" href="${esc(p.code)}" target="_blank" rel="noopener">💻 Code ansehen</a>` : ''}
      </div>
      ${p.code ? `<p class="star-hint">Gefällt dir das Projekt? Dann lass mir doch auf
        <a href="${esc(p.code)}" target="_blank" rel="noopener">GitHub</a> einen ⭐ da!</p>` : ''}`;
  },
  notfound() {
    return `<h1>🤔 Nicht gefunden</h1><p class="lead">Diese Seite gibt es nicht.</p><a class="btn" href="#home">Zurück zu Home</a>`;
  },
};

function render() {
  const [page, arg] = (location.hash.slice(1) || 'home').split('/');
  const fn = PAGES[page] || PAGES.notfound;
  $('app').innerHTML = `<div class="page">${fn(arg)}</div>`;
  document.querySelectorAll('.nav-link').forEach(a => a.classList.toggle('active', a.dataset.page === page));
  $('dropBtn').classList.toggle('active', page === 'projekt' || page === 'projekte');
  closeMenu();
  window.scrollTo(0, 0);
  const p = page === 'projekt' && PROJEKTE.find(x => x.id === arg);
  document.title = p ? `${p.name} – ${ICH.name}` : page === 'impressum' ? `Impressum – ${ICH.name}` : ICH.name;
}

function buildMenu() {
  $('dropMenu').innerHTML = PROJEKTE.map(p => `
    <a href="#projekt/${p.id}"><span class="emoji">${p.emoji}</span><span>${esc(p.name)}<small>${esc(p.kurz)}</small></span></a>`).join('')
    + `<div class="soon">🛠️ Mehr kommt bald …</div><hr><a href="#projekte"><span class="emoji">📂</span><span>Alle Projekte</span></a>`;
}

/* ---------- Easter Egg: Matt in 2 (klick auf die Schachfigur) ---------- */
const PUZZLE = { fen: 'kbK5/pp6/1P6/8/8/8/8/R7 w - - 0 1', von: 'Paul Morphy', loesung: ['Ra6', 'bxa6', 'b7#'] };
const GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
let game = null, sel = null, last = null, busy = false, run = 0;

function loadChess(cb) {
  if (window.Chess) return cb();
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js';
  s.onload = cb;
  s.onerror = () => puzStatus('Das Schachbrett konnte nicht geladen werden 😕');
  document.head.appendChild(s);
}

function openPuzzle() {
  if ($('puzzle')) return;
  const m = document.createElement('div');
  m.className = 'modal'; m.id = 'puzzle';
  m.innerHTML = `<div class="modal-box" role="dialog" aria-label="Schachrätsel">
    <button class="modal-close" aria-label="Schließen" onclick="closePuzzle()">×</button>
    <h3>♟️ Du hast mein Geheimnis gefunden!</h3>
    <p class="sub">Weiß zieht und setzt in 2 Zügen matt. Ein Klassiker von ${PUZZLE.von}.</p>
    <div class="board" id="board"></div>
    <div class="puz-status" id="puzStatus">Klick auf eine weiße Figur und dann auf ihr Zielfeld.</div>
    <div class="puz-btns">
      <button onclick="resetPuzzle()">↺ Neu starten</button>
      <button onclick="showSolution()">💡 Lösung zeigen</button>
    </div>
  </div>`;
  m.addEventListener('click', e => { if (e.target === m) closePuzzle(); });
  document.body.appendChild(m);
  loadChess(resetPuzzle);
}

function closePuzzle() { const m = $('puzzle'); if (m) m.remove(); busy = false; run++; }
function puzStatus(t, win) { const s = $('puzStatus'); if (s) { s.textContent = t; s.classList.toggle('win', !!win); } }
// Verzögerte Aktion – fällt weg, wenn das Rätsel inzwischen neu gestartet oder geschlossen wurde
const later = (fn, ms) => { const r = run; setTimeout(() => { if ($('puzzle') && r === run) fn(); }, ms); };

function resetPuzzle() {
  game = new Chess(PUZZLE.fen); sel = null; last = null; busy = false; run++;
  drawBoard();
  puzStatus('Klick auf eine weiße Figur und dann auf ihr Zielfeld.');
}

function drawBoard() {
  if (!$('board')) return;
  const targets = sel ? game.moves({ square: sel, verbose: true }).map(m => m.to) : [];
  let html = '';
  for (let r = 8; r >= 1; r--) for (let f = 0; f < 8; f++) {
    const sq = 'abcdefgh'[f] + r, p = game.get(sq);
    const cls = ['sq', (f + r) % 2 === 1 ? 'dark' : '',
      last && (sq === last.from || sq === last.to) ? 'last' : '', sq === sel ? 'sel' : '',
      targets.includes(sq) ? 'hint' + (p ? ' cap' : '') : ''].join(' ');
    html += `<div class="${cls}" onclick="clickSquare('${sq}')">`
      + (p ? `<span class="pc-${p.color}">${GLYPH[p.type]}︎</span>` : '')
      + (r === 1 ? `<span class="co f">${sq[0]}</span>` : '') + (f === 0 ? `<span class="co r">${r}</span>` : '')
      + '</div>';
  }
  $('board').innerHTML = html;
}

function clickSquare(sq) {
  if (busy || !game || game.turn() !== 'w' || game.in_checkmate()) return;
  const p = game.get(sq);
  if (sel && sel !== sq) {
    const mv = game.move({ from: sel, to: sq, promotion: 'q' });
    if (mv) { sel = null; return afterWhiteMove(mv); }
  }
  sel = p && p.color === 'w' && sel !== sq ? sq : null;
  drawBoard();
}

function afterWhiteMove(mv) {
  last = mv; drawBoard();
  const first = game.history().length === 1;
  if (game.in_checkmate()) return puzStatus('♛ Schachmatt! Stark, du hast das Rätsel gelöst! 🎉', true);
  busy = true;
  if (!first) {
    puzStatus('Das ist leider noch kein Matt. Versuch’s nochmal! 🤔');
    return later(() => { game.undo(); last = null; busy = false; drawBoard(); }, 1100);
  }
  if (mv.san !== PUZZLE.loesung[0]) {
    puzStatus('Hmm, damit klappt das Matt in 2 noch nicht. Probier einen anderen Zug! 🤔');
    return later(() => { game.undo(); last = null; busy = false; drawBoard(); }, 1100);
  }
  puzStatus('Wow, du opferst den Turm? Mutig! 😮 Schwarz überlegt …');
  later(() => {
    // Meistens nimmt Schwarz den Turm – manchmal versucht er es anders
    const replies = game.moves();
    const r = replies.includes('bxa6') && Math.random() < 0.7 ? 'bxa6' : replies[Math.floor(Math.random() * replies.length)];
    last = game.move(r); busy = false; drawBoard();
    puzStatus(`Schwarz spielt ${r}. Jetzt du: Setz matt!`);
  }, 900);
}

function showSolution() {
  if (!game) return;
  resetPuzzle(); busy = true;
  puzStatus('1. Ra6!! Der Turm wird geopfert …');
  PUZZLE.loesung.forEach((san, i) => later(() => {
    last = game.move(san); drawBoard();
    if (i === 1) puzStatus('1… bxa6: Schwarz nimmt den Turm. Jetzt ist die b-Linie offen …');
    if (i === 2) puzStatus('2. b7#: Matt! (Zieht Schwarz stattdessen den Läufer, kommt 2. Rxa7#) 🎉', true);
  }, 900 * (i + 1)));
}

function closeMenu() { $('dropdown').classList.remove('open'); $('dropBtn').setAttribute('aria-expanded', 'false'); }
$('dropBtn').addEventListener('click', e => {
  e.stopPropagation();
  const open = $('dropdown').classList.toggle('open');
  $('dropBtn').setAttribute('aria-expanded', open);
});
document.addEventListener('click', e => { if (!$('dropdown').contains(e.target)) closeMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); closePuzzle(); } });
window.addEventListener('hashchange', render);

$('logo').textContent = ICH.name;
$('footer').innerHTML = `© ${new Date().getFullYear()} ${esc(ICH.name)} · gemacht mit ❤️ und GitHub Pages`
  + `<a class="imp" href="#impressum">Impressum</a>`;
buildMenu();
render();
</script>
